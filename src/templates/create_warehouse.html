{% extends "base.html" %}

{% block title %}Create Warehouse - Warehouse Manager{% endblock %}

{% block content %}
<div class="card">
    <h2>Create New Warehouse</h2>
    <form method="post">
        <div class="form-group">
            <label for="name">Warehouse Name</label>
            <input type="text" id="name" name="name" required placeholder="Enter warehouse name">
        </div>
        <div class="form-group">
            <label for="capacity">Capacity</label>
            <input type="number" id="capacity" name="capacity" required min="0.01" step="0.01" placeholder="Enter maximum capacity">
        </div>
        <div class="form-group">
            <label for="initial_balance">Initial Balance (optional)</label>
            <input type="number" id="initial_balance" name="initial_balance" min="0" step="0.01" value="0" placeholder="Enter initial content amount">
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <button type="submit" class="btn btn-success">Create Warehouse</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
