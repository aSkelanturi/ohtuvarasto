{% extends "base.html" %}

{% block title %}Edit {{ name }} - Warehouse Manager{% endblock %}

{% block content %}
<div class="card">
    <h2>Edit Warehouse: {{ name }}</h2>
    <form method="post">
        <div class="form-group">
            <label for="name">Warehouse Name</label>
            <input type="text" id="name" name="name" required value="{{ name }}">
        </div>
        <div class="form-group">
            <label for="capacity">Capacity</label>
            <input type="number" id="capacity" name="capacity" required min="0.01" step="0.01" value="{{ warehouse.tilavuus }}">
        </div>
        <p style="color: #666; margin-bottom: 1rem;">Current balance: {{ "%.2f"|format(warehouse.saldo) }}</p>
        <div style="display: flex; gap: 0.5rem;">
            <button type="submit" class="btn btn-success">Save Changes</button>
            <a href="{{ url_for('view_warehouse', name=name) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
